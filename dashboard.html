<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f3ff">
  <title>Dashboard | PaperPilot</title>
  <link rel="stylesheet" href="bad-ui.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [hidden] { display: none !important; }
    .logout-backdrop { background: rgb(25 17 42 / 42%); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
    .logout-dialog { animation: dialog-enter 160ms ease-out; }
    @keyframes dialog-enter { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { .logout-dialog { animation: none; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
      }
    }
  </script>
</head>
<body data-ui="bad" class="min-h-screen bg-[#f6f3ff] text-slate-800">
  <header class="border-b border-[#e9e2f3] bg-white">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4 sm:px-6">
      <a href="index.html" class="text-xl font-bold tracking-tight text-[#6a35c1]">PaperPilot</a>
      <button id="logoutButton" type="button" disabled class="rounded-xl bg-[#6a35c1] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[#5829a6] disabled:cursor-wait disabled:opacity-60">Logout</button>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-12 sm:px-6">
    <section class="rounded-3xl border border-[#e9e2f3] bg-white p-7 shadow-xl shadow-purple-950/5 sm:p-10">
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-[#6a35c1]">Your learning space</p>
      <h1 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">Welcome, <span id="userName">...</span></h1>
      <p class="mt-3 text-slate-600">You’re signed in to PaperPilot.</p>
      <p class="mt-1 break-all text-sm text-slate-500" id="userEmail" aria-live="polite"></p>
      <a href="index.html" class="mt-7 inline-flex rounded-xl bg-[#ede7ff] px-5 py-3 font-semibold text-[#5427a5] transition hover:bg-[#e2d8ff]">Go to PaperPilot</a>
      <p id="dashboardFeedback" role="status" aria-live="polite" class="mt-4 text-sm text-red-600"></p>
    </section>
  </main>

  <div id="logoutModal" class="logout-backdrop fixed inset-0 z-50 grid place-items-center p-4" hidden>
    <section class="logout-dialog w-full max-w-md rounded-3xl border border-[#e9e2f3] bg-white p-7 shadow-2xl shadow-slate-950/20 sm:p-8"
      role="dialog" aria-modal="true" aria-labelledby="logoutTitle" aria-describedby="logoutDescription" tabindex="-1">
      <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-amber-100 text-amber-700" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
        </svg>
      </div>
      <h2 id="logoutTitle" class="mt-5 text-center text-xl font-bold text-slate-900">Log out of PaperPilot?</h2>
      <p id="logoutDescription" class="mt-2 text-center leading-6 text-slate-600">Are you sure you want to logout?</p>
      <p id="logoutError" class="mt-3 min-h-5 text-center text-sm text-red-600" role="alert" aria-live="assertive"></p>
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button id="cancelLogout" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-3 font-semibold text-slate-700 transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6a35c1] disabled:opacity-60">No, Stay Signed In</button>
        <button id="confirmLogout" type="button" class="rounded-xl bg-[#6a35c1] px-4 py-3 font-semibold text-white transition hover:bg-[#5829a6] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6a35c1] disabled:cursor-wait disabled:opacity-60">Yes, Logout</button>
      </div>
    </section>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "firebase/auth";

    const feedback = document.getElementById("dashboardFeedback");
    const logoutButton = document.getElementById("logoutButton");
    const logoutModal = document.getElementById("logoutModal");
    const logoutDialog = logoutModal.querySelector('[role="dialog"]');
    const cancelLogoutButton = document.getElementById("cancelLogout");
    const confirmLogoutButton = document.getElementById("confirmLogout");
    const logoutError = document.getElementById("logoutError");
    let logoutPending = false;
    let previousFocus = null;

    function openLogoutModal() {
      previousFocus = document.activeElement;
      logoutError.textContent = "";
      logoutModal.hidden = false;
      cancelLogoutButton.focus();
    }

    function closeLogoutModal() {
      if (logoutPending) return;
      logoutModal.hidden = true;
      logoutError.textContent = "";
      previousFocus?.focus();
    }

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      document.getElementById("userName").textContent =
        user.displayName || user.email?.split("@")[0] || "there";
      document.getElementById("userEmail").textContent = user.email || "";
      logoutButton.disabled = false;
    }, error => {
      console.error("Could not verify the PaperPilot sign-in session:", error);
      feedback.textContent = "We couldn’t verify your session. Please sign in again.";
      window.location.replace("login.html");
    });

    logoutButton.addEventListener("click", openLogoutModal);
    cancelLogoutButton.addEventListener("click", closeLogoutModal);
    logoutModal.addEventListener("click", event => {
      if (event.target === logoutModal) closeLogoutModal();
    });
    document.addEventListener("keydown", event => {
      if (logoutModal.hidden) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeLogoutModal();
      } else if (event.key === "Tab") {
        const focusable = [cancelLogoutButton, confirmLogoutButton].filter(button => !button.disabled);
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });
    logoutModal.addEventListener("keydown", event => {
      if (event.key === "Tab" && !logoutDialog.contains(event.target)) {
        event.preventDefault();
        cancelLogoutButton.focus();
      }
    });
    confirmLogoutButton.addEventListener("click", async () => {
      if (logoutPending) return;
      logoutPending = true;
      logoutButton.disabled = true;
      cancelLogoutButton.disabled = true;
      confirmLogoutButton.disabled = true;
      confirmLogoutButton.textContent = "Logging out…";
      feedback.textContent = "";
      logoutError.textContent = "";
      try {
        await signOut(auth);
        window.location.replace("login.html");
      } catch (error) {
        console.error("PaperPilot logout failed:", error);
        logoutError.textContent = "Logout failed. Please try again.";
        logoutButton.disabled = false;
        cancelLogoutButton.disabled = false;
        confirmLogoutButton.disabled = false;
        confirmLogoutButton.textContent = "Yes, Logout";
        logoutPending = false;
      }
    });
  </script>
</body>
</html>
